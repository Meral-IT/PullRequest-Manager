name: Build
permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Should a release be done?'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: windows-latest
            buildCommand: 'npm run build:win'
          - os: macos-latest
            buildCommand: 'npm run build:mac'
    runs-on: ${{ matrix.os }}
    outputs:
      semVer: ${{ steps.version.outputs.semVer }}
      preReleaseLabel: ${{ steps.version.outputs.preReleaseLabel }}

    steps:
      - uses: actions/checkout@v7
        if: inputs.doRelease == true
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}

      - uses: actions/checkout@v7
        if: inputs.doRelease != true
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set release type
        shell: pwsh
        run: |
          $RefName = $Env:GITHUB_REF_NAME
          $RefName = $RefName -replace 'refs/heads/', ''

          Write-Host "RefName: $RefName"

          if ($RefName -eq 'main') {
            Write-Host "Release type: EP_RELEASE"
            Add-Content -Path $env:GITHUB_ENV -Value "EP_RELEASE=true"
          }
          elseif ($RefName -eq 'develop') {
            Write-Host "Release type: EP_PRE_RELEASE"
            Add-Content -Path $env:GITHUB_ENV -Value "EP_PRE_RELEASE=true"
          }
          else {
            Write-Host "Release type: EP_DRAFT"
            Add-Content -Path $env:GITHUB_ENV -Value "EP_DRAFT=true"
          }

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Install dependencies
        run: npm ci --no-audit --progress=false

      - name: Lint
        run: npm run lint

      - name: Set version
        id: info
        run: npm version "$env:RELEASE_VERSION" --no-git-tag-version --allow-same-version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.semVer }}

      - name: Build
        run: ${{ matrix.buildCommand }}
        env:
          GH_TOKEN: ${{ secrets.GITHUBPUBLISHTOKEN }}

      - name: Smoke test
        run: npm test

      - name: List compiled files
        shell: pwsh
        run: |
          Get-ChildItem -Path dist | ForEach-Object {
            Write-Host "File: $($_.FullName)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Installer-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    if: inputs.doRelease == true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.semVer }}
          tag_name: v${{ needs.build.outputs.semVer }}
          files: dist/**/*
          prerelease: ${{ needs.build.outputs.preReleaseLabel != '' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_PAT }}
